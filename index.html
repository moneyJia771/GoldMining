<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金挖矿游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="header">
            <div id="score">金币: <span id="scoreValue">0</span></div>
            <div id="timer">时间: <span id="timeValue">60</span>s</div>
            <div id="target">目标: <span id="targetValue">500</span></div>
        </div>

        <div id="gameArea">
            <div id="miner">
                <div id="hook">
                    <div id="line"></div>
                    <div id="claw"></div>
                </div>
            </div>

            <div id="underground">
                <!-- 金块和石头将动态生成 -->
            </div>
        </div>

        <div id="controls">
            <button id="startBtn">开始游戏</button>
            <button id="resetBtn">重新开始</button>
        </div>

        <div id="gameOver" class="hidden">
            <div id="gameOverContent">
                <h2 id="gameResult">游戏结束</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button id="playAgainBtn">再玩一次</button>
            </div>
        </div>
    </div>

    <script src="effects.js"></script>
    <script src="script.js"></script>
</body>
</html>
