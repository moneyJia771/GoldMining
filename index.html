<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金矿工</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 开始界面 -->
        <div id="start-screen" class="screen">
            <div class="logo">黄金矿工</div>
            <div class="buttons">
                <button id="start-game">开始游戏</button>
                <button id="level-select">关卡选择</button>
                <button id="settings">设置</button>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="screen hidden">
            <div class="game-info">
                <div class="level">关卡: <span id="current-level">1</span></div>
                <div class="target">目标: <span id="target-amount">0</span></div>
                <div class="score">当前: <span id="current-amount">0</span></div>
                <div class="timer">时间: <span id="time-left">60</span></div>
            </div>
            
            <div id="game-area">
                <canvas id="game-canvas"></canvas>
            </div>
            
            <button id="pause-btn" class="game-btn">暂停</button>
        </div>

        <!-- 结束界面 - 成功 -->
        <div id="success-screen" class="screen hidden">
            <h2>闯关成功！</h2>
            <div class="stars">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>
            <div class="buttons">
                <button id="next-level">下一关</button>
                <button id="replay-level">重玩</button>
                <button id="back-to-menu">返回</button>
            </div>
        </div>

        <!-- 结束界面 - 失败 -->
        <div id="fail-screen" class="screen hidden">
            <h2>再接再厉</h2>
            <div class="buttons">
                <button id="restart-level">重新开始</button>
                <button id="use-props">使用道具</button>
                <button id="back-to-menu-fail">返回</button>
            </div>
        </div>

        <!-- 暂停界面 -->
        <div id="pause-screen" class="screen hidden">
            <h2>游戏暂停</h2>
            <div class="buttons">
                <button id="continue-game">继续游戏</button>
                <button id="restart-game">重新开始</button>
                <button id="exit-level">退出关卡</button>
            </div>
        </div>

        <!-- 关卡选择界面 -->
        <div id="level-select-screen" class="screen hidden">
            <h2>关卡选择</h2>
            <div id="levels-grid"></div>
            <button id="back-from-levels">返回</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
